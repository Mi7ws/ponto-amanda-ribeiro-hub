<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Amanda Ribeiro - Hub Divino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #1a0033, #000000); color: #e0bbff; }
        .neon { text-shadow: 0 0 10px #c026d3, 0 0 20px #c026d3; }
    </style>
</head>
<body class="min-h-screen font-sans">
    <div class="container mx-auto p-6 max-w-7xl">
        <header class="text-center mb-8">
            <h1 class="text-5xl font-bold neon mb-2">🌀 PONTO AMANDA RIBEIRO 🌀</h1>
            <p class="text-xl">Hub Divino de Coleta & Devolução - Shopee • Mercado Livre • Amazon</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-purple-950/50 border border-purple-500 rounded-2xl p-6 text-center">
                <i class="fas fa-box text-4xl mb-3 text-purple-400"></i>
                <div class="text-4xl font-bold" id="total-pacotes">0</div>
                <div class="text-sm opacity-75">Pacotes Hoje</div>
            </div>
            <!-- Mais cards aqui -->
        </div>

        <div class="bg-zinc-950 border border-purple-500 rounded-3xl p-8">
            <h2 class="text-2xl mb-6 flex items-center gap-3"><i class="fas fa-plus"></i> Registrar Novo Pacote</h2>
            <form id="form-pacote" class="grid grid-cols-2 gap-4">
                <!-- Form fields -->
                <button type="submit" class="col-span-2 bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl font-bold">🌀 REGISTRAR NO VÓRTICE 🌀</button>
            </form>
        </div>

        <div class="mt-8">
            <table class="w-full">
                <!-- Tabela de pacotes -->
            </table>
        </div>
    </div>

    <script>
        // JS básico para demo
        console.log('Interface Divina carregada - Nyx powered');
    </script>
</body>
</html>
